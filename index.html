<header class="hero">

    <div class="title-badge">
        [YOUR TITLE]
    </div>

    <h1>[YOUR GREETING]</h1>

    <p class="date">[DATE]</p>

    <div class="clock" id="clock">
        00:00:00 PM
    </div>

    <p class="description">
        [YOUR DESCRIPTION]
    </p>

    <div class="buttons">
        <button onclick="switchTheme()">
            [BUTTON 1]
        </button>

        <button onclick="viewTasks()">
            [BUTTON 2]
        </button>
    </div>

    <button class="section-button" onclick="sectionHub()">
        [SECTION HUB]
    </button>

</header>
<section class="card all-tasks">

    <h2>[SECTION TITLE]</h2>

    <div class="number">
        [NUMBER]
    </div>

    <p>
        [YOUR DESCRIPTION]
    </p>

</section>


<section class="card urgent-tasks">

    <h2>[SECTION TITLE]</h2>

    <div class="number">
        [NUMBER]
    </div>

    <p>
        [YOUR DESCRIPTION]
    </p>

</section>


<section class="card nearest-deadline">

    <h2>[SECTION TITLE]</h2>

    <div class="number">
        [NUMBER]
    </div>

    <p>
        [YOUR DESCRIPTION]
    </p>

</section>
